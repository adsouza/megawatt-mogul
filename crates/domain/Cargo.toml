[package]
name = "domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The dependency rule (see ARCHITECTURE.md): this section may only ever list small, pure crates.
# tests/dependency_rule.rs fails the test suite if a framework or I/O crate appears here.
[dependencies]
rand_chacha = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Integration tests (tests/portable_state.rs) use the fixtures; this keeps `-p domain` building
# them without the workspace's downstream crates turning the feature on.
domain = { workspace = true, features = ["test-fixtures"] }
proptest = { workspace = true }
insta = { workspace = true }

[features]
# Exposes in-code fixture builders to the test suites of downstream crates.
test-fixtures = []

[lints]
workspace = true
