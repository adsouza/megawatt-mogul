[profile.default]
fail-fast = false

# Start the multi-month acceptance scenarios while all workers are still available. Otherwise
# lexicographic binary ordering leaves these CPU-heavy tests at the end of a workspace run.
[[profile.default.overrides]]
filter = 'binary(shipped_regions)'
priority = 100

[profile.ci]
retries = 0

# Used by cargo-mutants (see .cargo/mutants.toml): stop at the first failing test and terminate
# running tests immediately, so a mutant that makes a loop spin forever is caught by the
# first failure instead of waiting out the timeout.
[profile.mutants]
fail-fast = { max-fail = 1, terminate = "immediate" }
