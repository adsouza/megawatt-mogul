[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/infrastructure"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Internal crates
domain = { path = "crates/domain" }
application = { path = "crates/application" }

# Runtime dependencies
rand_chacha = "0.10"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
sha2 = "0.11"

# Test-only dependencies
proptest = "1.12"
proptest-state-machine = "0.9"
insta = "1.49"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Money is plain i64 arithmetic: an overflow must panic, never wrap, in every profile.
[profile.release]
overflow-checks = true
