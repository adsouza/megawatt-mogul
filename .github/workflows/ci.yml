name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bevy's Linux build dependencies, from Bevy 0.20's docs/linux_dependencies.md (Ubuntu), plus
      # the XCB libraries bevy_egui's docs list for its clipboard support. The game tests run
      # headless (MinimalPlugins, no window or GPU), so no display server is needed.
      - name: Install Bevy's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 \
            libwayland-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --profile ci
