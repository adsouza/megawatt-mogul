name: CI

# Pull requests run on their own event; pushes run only on main. Browser dependency caches
# also persist within each PR; native test caches are shared from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its superseded run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI: it multiplies the size of target/, and so of the cache to save and
  # restore, for backtraces that CI logs do not need. Dependencies already build without it.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build-tests:
    # Archives embed fixture and helper-binary paths. Build and run on the same OS and
    # checkout path; workers extract into the workspace so those absolute paths remain valid.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.native.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Release metadata and packaging contracts
        run: python3 -m unittest discover -s tools/release/tests
      - name: Test CI shard coverage checker
        run: python3 -m unittest discover -s tools/ci/tests
      - uses: ./.github/actions/native-test-build
        id: native

  test:
    name: Test (${{ matrix.name }})
    needs: build-tests
    runs-on: ubuntu-24.04
    strategy:
      # Finish all shards even if another shard fails, preserving full failure evidence.
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-tests.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-test-run
        with:
          filter: ${{ matrix.filter }}
          partition: ${{ matrix.partition }}

  # Keep the existing required check name, and never report success when a shard was
  # failed, skipped or cancelled. Pages and branch protection can depend on this gate.
  check:
    needs: [build-tests, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the build and every test shard to pass
        env:
          BUILD_RESULT: ${{ needs.build-tests.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  # The `dev` feature changes the game crate's dependency graph, so it builds separately anyway;
  # as its own job it runs in parallel with the workspace build and shards, with its own cache.
  dev-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Clippy (development tools)
        run: cargo clippy -p game --all-targets --features dev -- -D warnings
      - name: Test (development tools)
        run: cargo nextest run -p game --features dev --profile ci

  browser:
    permissions:
      contents: read
      pages: read
    # Match the Playwright image baseline so the native backup helper runs inside it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      MM_BUILD_SHA: ${{ github.sha }}
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v7
      # Only infrastructure tools are built natively; the Bevy client targets WASM.
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      # rust-cache hashes every installed compiler, including the runner's unused stable
      # toolchain. Runner image updates otherwise invalidate our pinned 1.98.1 build cache.
      - name: Keep only the active Rust toolchain
        shell: bash
        run: |
          active_toolchain=$(rustup show active-toolchain)
          active_toolchain=${active_toolchain%% *}
          installed_toolchains=$(rustup toolchain list)
          while read -r installed_toolchain _; do
            if [[ "$installed_toolchain" != "$active_toolchain" ]]; then
              rustup toolchain uninstall "$installed_toolchain"
            fi
          done <<< "$installed_toolchains"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: browser-rust-v1
          shared-key: ubuntu24-wasm
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - name: Check browser tooling and image version
        run: |
          python3 tools/web/test_contracts.py
          node --test tools/web/tests/prune_browser_cache.test.cjs
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const version = JSON.parse(readFileSync('web/tests/package.json')).devDependencies['@playwright/test'];
          if (!process.env.PLAYWRIGHT_IMAGE.startsWith(`mcr.microsoft.com/playwright:v${version}-noble@sha256:`)) {
            throw new Error('Playwright package and pinned container versions must match');
          }
          JS
      - name: Read configured Pages metadata
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: pages
        uses: actions/configure-pages@v6
      - name: Select the tested public path
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          CONFIGURED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base='/megawatt-mogul'
          if [[ "$IS_MAIN" == 'true' ]]; then
            base="$CONFIGURED_BASE_PATH"
          fi
          printf 'WEB_PUBLIC_PATH=%s/\n' "$base" >> "$GITHUB_ENV"
      - name: Build browser distribution
        working-directory: web
        run: trunk build --release --public-url "$WEB_PUBLIC_PATH"
      - name: Build native acceptance tools
        run: cargo build --locked -p infrastructure --example save_backup --example geothermal_acceptance
      - run: npm ci --prefix web/tests
      - name: Test the distribution at its deployed subpath
        run: |
          export WEB_BASE_URL="http://127.0.0.1:8765$WEB_PUBLIC_PATH"
          python3 tools/web/serve.py > target/web-server.log 2>&1 &
          web_server_pid=$!
          trap 'kill "$web_server_pid" 2>/dev/null || true' EXIT
          docker run --rm --init --ipc=host --network=host \
            --env CI=true --env NODE_OPTIONS --env WEB_BASE_URL \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            "$PLAYWRIGHT_IMAGE" npm test --prefix web/tests -- --reporter=line
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: |
            web/tests/test-results/
            target/web-server.log
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    needs: [check, dev-tools, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check this commit is still main's head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" == "$SOURCE_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@v5.0.1
        if: steps.current.outputs.deploy == 'true'
        id: deploy
