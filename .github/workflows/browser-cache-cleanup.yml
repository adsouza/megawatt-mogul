name: Browser cache cleanup

# This privileged workflow reads only default-branch code, never the PR's checkout.
on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const prune = require('./tools/web/prune_browser_cache.cjs');
            await prune({github, context, core});
