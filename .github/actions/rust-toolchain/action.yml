name: Rust toolchain
description: The pinned Rust compiler, with only the targets and components a job needs.
inputs:
  components:
    description: Extra toolchain components, comma separated.
    default: ''
  targets:
    description: Additional target triples, comma separated.
    default: ''
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: '1.98.1'
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
