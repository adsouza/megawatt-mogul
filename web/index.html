<script>
// Only this deployment's files can fail the boot. Scripts a CDN injects, such as an analytics
// beacon a content blocker stops, fail on another origin or as muted "Script error." events.
window.mmOwnFailure = event => {
  const element = event.target instanceof Element ? event.target : null;
  const url = element ? element.src || element.href || location.href : event.filename;
  return typeof url === "string" && url !== "" && new URL(url, location.href).origin === location.origin;
};
window.addEventListener("error", event => { if (mmOwnFailure(event)) window.mmBootFailed = true; }, true);
window.addEventListener("unhandledrejection", () => { window.mmBootFailed = true; });
</script>
